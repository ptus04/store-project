name: build-workflow.yml

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  build-push-image:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - module: server
            image-name: phungtu081/store-server
          - module: web
            image-name: phungtu081/store-web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6.1.0
        with:
          images: ${{ matrix.image-name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long
            type=ref,event=tag

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.1.0

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7.1.0
        with:
          context: ${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_API_URL=https://ptus04-store-app.azurewebsites.net/
            VITE_IMAGE_CONTAINER_URL=https://ptus04storageaccount.blob.core.windows.net/images
            VITE_STORAGE_URL=https://ptus04storageaccount.blob.core.windows.net/carousel
