<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}">
<head>
    <meta charset="UTF-8">
    <title>Update Profile | SLY</title>
</head>
<body>
<main class="min-h-screen bg-[#f7f7f7] px-4 py-8 md:px-6 lg:px-8">
    <div class="mx-auto max-w-3xl space-y-6">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500">Profile</p>
            <h1 class="mt-2 text-3xl font-bold text-gray-900">Update Profile</h1>
        </div>

        <section class="rounded-[28px] border border-gray-200 bg-white p-6 shadow-sm">
            <form th:action="@{/thong-tin-tai-khoan/cap-nhat}" th:object="${request}" method="post" class="space-y-5">
                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="name">Full name</label>
                    <input id="name" type="text" th:field="*{name}" class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="phone">Phone number</label>
                    <input id="phone" type="text" th:field="*{phone}" class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div class="flex items-center justify-end gap-3 pt-2">
                    <a th:href="@{/profile}" class="rounded-2xl border border-gray-200 bg-white px-5 py-3 text-sm font-semibold text-gray-900 transition hover:bg-gray-50">Cancel</a>
                    <button type="submit" class="rounded-2xl bg-gray-900 px-5 py-3 text-sm font-semibold text-white transition hover:bg-black">Save changes</button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
