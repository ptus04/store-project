<!DOCTYPE html>
<html lang="vi"
      xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}">
<!--/*@thymesVar id="updateProfileRequest" type="io.github.ptus04.server.dto.request.UserProfileUpdateRequest"*/-->
<head>
    <meta charset="UTF-8">
    <title>Cập nhật thông tin | SLY</title>
</head>
<body>
<main class="min-h-screen bg-[#f7f7f7] px-4 py-12 md:px-6 lg:px-8">
    <div class="mx-auto max-w-2xl space-y-6">
        <div>
            <p class="text-xs font-semibold uppercase tracking-[0.2em] text-gray-500">Tài khoản</p>
            <h1 class="mt-2 text-3xl font-bold text-gray-900">Cập nhật thông tin</h1>
        </div>

        <section class="rounded-[28px] border border-gray-200 bg-white p-6 md:p-8 shadow-sm">
            <form th:action="@{/profile/update}" th:object="${updateProfileRequest}" method="post" class="space-y-5">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="name">Họ và tên *</label>
                    <input id="name" type="text" th:field="*{name}" required class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="Nhập họ và tên của bạn"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="phone">Số điện thoại *</label>
                    <input id="phone" type="tel" th:field="*{phone}" required pattern="^0[2-9]\d{8}$" class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="Nhập số điện thoại"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="email">Email</label>
                    <input id="email" type="email" th:field="*{email}" class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900 focus:ring-1 focus:ring-gray-900" placeholder="VD: email@example.com"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700">Giới tính</label>
                    <div class="flex gap-6 mt-2">
                        <label class="flex items-center gap-2 text-sm font-medium text-gray-700 cursor-pointer select-none">
                            <input type="radio" th:field="*{gender}" value="MALE" class="h-4.5 w-4.5 rounded-full border-gray-300 text-red-600 focus:ring-red-500"/> Nam
                        </label>
                        <label class="flex items-center gap-2 text-sm font-medium text-gray-700 cursor-pointer select-none">
                            <input type="radio" th:field="*{gender}" value="FEMALE" class="h-4.5 w-4.5 rounded-full border-gray-300 text-red-600 focus:ring-red-500"/> Nữ
                        </label>
                    </div>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('gender')}" th:errors="*{gender}"></p>
                </div>

                <div>
                    <label class="mb-2 block text-sm font-semibold text-gray-700" for="birthDate">Ngày sinh</label>
                    <input id="birthDate" type="date" name="birthDate" th:value="${updateProfileRequest.birthDate != null ? #temporals.format(updateProfileRequest.birthDate, 'yyyy-MM-dd') : ''}" class="w-full rounded-2xl border border-gray-200 px-4 py-3 outline-none transition focus:border-gray-900 focus:ring-1 focus:ring-gray-900"/>
                    <p class="mt-1 text-sm text-red-500" th:if="${#fields.hasErrors('birthDate')}" th:errors="*{birthDate}"></p>
                </div>

                <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">
                    <a th:href="@{/profile}" class="rounded-2xl border border-gray-200 bg-white px-6 py-3 text-sm font-semibold text-gray-700 transition hover:bg-gray-50">Hủy bỏ</a>
                    <button type="submit" class="rounded-2xl bg-gray-900 px-6 py-3 text-sm font-semibold text-white transition hover:bg-black">Lưu thay đổi</button>
                </div>
            </form>
        </section>
    </div>
</main>
</body>
</html>
