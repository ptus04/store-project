<!DOCTYPE html>
<html lang="vi" th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản | SLY</title>
</head>

<body>
<main class="min-h-screen bg-[#f7f7f7] px-4 py-12 md:px-10 lg:px-16">
    <div class="mx-auto max-w-7xl space-y-10">

        <!-- HEADER -->
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between mb-6">
            <div>
                <h1 class="mt-2 text-3xl font-bold text-gray-900">Thông tin tài khoản</h1>
            </div>
        </div>

        <!-- LAYOUT -->
        <div class="flex flex-col gap-8">

            <!-- ROW 1: INFO & ADDRESS -->
            <section class="flex flex-col gap-8 mb-10 lg:grid lg:grid-cols-[415px_minmax(0,1fr)] lg:items-stretch">

                <!-- CARD 1: SIDEBAR (INFO) -->
                <aside
                        class="rounded-[28px] border border-gray-200 bg-white px-8 py-10 shadow-sm flex flex-col h-full">
                    <div class="flex flex-col items-center text-center">
                        <!-- Avatar -->
                        <div class="flex h-24 w-24 items-center justify-center rounded-full shadow-md ring-4 ring-white"
                             style="background: linear-gradient(135deg, #c9d6e3 0%, #a0b0c4 100%);">
                            <i class="fa fa-user text-3xl" style="color: #4a5a6e;"></i>
                        </div>

                        <!-- Info -->
                        <h2 class="mt-5 text-xl font-bold text-gray-900" th:text="${user.name}">Tên người dùng</h2>
                        <div class="mt-4 text-left space-y-1">
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">Email:</span>
                                <span th:text="${user.email != null ? user.email : 'Chưa cập nhật'}"></span>
                            </p>
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">SĐT:</span>
                                <span th:text="${user.phone != null ? user.phone : 'Chưa cập nhật'}"></span>
                            </p>
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">Giới tính:</span>
                                <span th:text="${user.gender != null ? (user.gender.name() == 'MALE' ? 'Nam' : 'Nữ') : 'Chưa cập nhật'}"></span>
                            </p>
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">Ngày sinh:</span>
                                <span th:text="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd-MM-yyyy') : 'Chưa cập nhật'}"></span>
                            </p>
                        </div>

                        <!-- Stats -->
                        <div class="mt-8 flex w-full justify-between rounded-2xl bg-gray-50 p-5">
                            <div class="flex flex-col items-center gap-1 flex-1">
                                <span class="text-lg font-bold text-gray-900">0</span>
                                <span class="text-xs text-gray-500 font-medium text-center">Đơn hàng</span>
                            </div>
                            <div class="w-px bg-gray-200"></div>
                            <div class="flex flex-col items-center gap-1 flex-1">
                                <span class="text-lg font-bold text-gray-900" th:text="${addresses.size()}">0</span>
                                <span class="text-xs text-gray-500 font-medium text-center">Địa chỉ</span>
                            </div>
                        </div>

                        <!-- Member since -->
                        <p class="mt-3 text-xs text-gray-400 text-center">
                            Là thành viên từ ngày
                            <span class="font-semibold text-gray-600"
                                  th:text="${#temporals.format(user.createdAt, 'dd-MM-yyyy')}">--/--/----</span>
                        </p>
                    </div>

                    <!-- ACTION -->
                    <div class="mt-auto pt-6 flex flex-col items-center gap-3">
                        <div style="width: 220px;">
                            <a class="block w-full rounded-xl border border-red-500 bg-white px-4 py-2.5 text-center text-sm font-semibold text-red-500 transition hover:bg-red-50"
                               th:href="@{/profile/update}">
                                Cập nhật thông tin
                            </a>
                        </div>
                        <div style="width: 220px;">
                            <form method="post" th:action="@{/auth/logout}">
                                <button class="my-btn-primary w-full" type="submit">Đăng xuất</button>
                            </form>
                        </div>
                    </div>
                </aside>

                <!-- CARD 2: ĐỊA CHỈ -->
                <section
                        class="rounded-[28px] border border-gray-200 bg-white px-8 py-10 shadow-sm flex flex-col h-full">
                    <!-- Address Card Header -->
                    <div class="mb-6 flex items-center justify-between border-b border-gray-100 pb-4 shrink-0"
                         style="margin-left: 1cm; margin-right: 1cm;">
                        <div class="flex items-center gap-2">
                            <i class="fa fa-location-dot text-gray-500 text-xl"></i>
                            <h3 class="text-xl font-bold text-gray-900">Địa chỉ (<span th:text="${addresses.size()}">0</span>/10)</h3>
                        </div>
                        <button onclick="document.getElementById('addressModal').classList.remove('hidden')" 
                                th:if="${addresses.size() < 10}"
                                class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-semibold hover:bg-gray-50 transition text-gray-900"
                                type="button">
                            + Thêm mới
                        </button>
                        <button th:if="${addresses.size() >= 10}" disabled title="Đã đạt giới hạn 10 địa chỉ"
                                class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-semibold bg-gray-100 text-gray-400 cursor-not-allowed"
                                type="button">
                            + Thêm mới
                        </button>
                    </div>

                    <!-- ADDRESS LIST (Scrollable) -->
                    <div class="flex flex-1 flex-col gap-4 overflow-y-auto pr-2 [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-[#f1f1f1] [&::-webkit-scrollbar-track]:rounded-[8px] [&::-webkit-scrollbar-thumb]:bg-[#d1d5db] [&::-webkit-scrollbar-thumb]:rounded-[8px] [&::-webkit-scrollbar-thumb:hover]:bg-[#9ca3af]">
                        <!-- Empty State -->
                        <div th:if="${addresses.isEmpty()}"
                                class="flex flex-1 flex-col items-center justify-center gap-2 text-gray-500 min-h-[150px]">
                            <i class="fa fa-map-location-dot text-3xl mb-1"></i>
                            <span class="text-center">Bạn chưa có địa chỉ nào</span>
                        </div>
                        
                        <!-- List -->
                        <div th:each="addr : ${addresses}" class="rounded-2xl border border-gray-100 bg-white p-4 flex flex-col gap-3 shadow-sm hover:shadow-md transition">
                            <div class="flex justify-between items-start">
                                <div class="flex items-center gap-2">
                                    <span th:if="${addr.isDefault}" class="rounded-md bg-red-100 px-2 py-1 text-xs font-semibold text-red-600 border border-red-200">Mặc định</span>
                                    <span class="text-sm font-semibold text-gray-900" th:text="${addr.city}">Thành phố</span>
                                </div>
                                <div class="flex items-center gap-3">
                                    <form th:if="${!addr.isDefault}" method="post" th:action="@{'/profile/addresses/' + ${addr.id} + '/set-default'}">
                                        <button type="submit" class="text-xs font-semibold text-gray-500 hover:text-gray-900 underline underline-offset-2">Đặt mặc định</button>
                                    </form>
                                    <form method="post" th:action="@{'/profile/addresses/' + ${addr.id} + '/delete'}" onsubmit="return confirm('Bạn có chắc chắn muốn xóa địa chỉ này?');">
                                        <button type="submit" class="text-xs font-semibold text-red-500 hover:text-red-700"><i class="fa fa-trash-can"></i> Xóa</button>
                                    </form>
                                </div>
                            </div>
                            <p class="text-[15px] text-gray-600 leading-relaxed" th:text="${addr.address + ', ' + addr.ward + (addr.district != null and !addr.district.isEmpty() ? ', ' + addr.district : '') + ', ' + addr.city}">Chi tiết địa chỉ</p>
                        </div>
                    </div>
                </section>

            </section>

            <!-- ROW 2: ĐƠN HÀNG -->
            <section
                    class="mt-0 rounded-[28px] border border-gray-200 bg-white p-6 md:p-8 shadow-sm flex flex-col min-h-[500px]">
                <!-- Header -->
                <div class="mb-6 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa fa-bag-shopping text-gray-500 text-xl"></i>
                        <h3 class="text-xl font-bold text-gray-900">Đơn hàng của tôi</h3>
                    </div>
                    <a class="text-red-500 hover:text-red-600 font-semibold text-sm flex items-center gap-1"
                       th:href="@{/products}">
                        Mua sắm tiếp <i class="fa fa-arrow-right"></i>
                    </a>
                </div>

                <!-- Order Status Tabs -->
                <div
                        class="flex items-center gap-2 mb-6 border-b border-gray-100 pb-4 overflow-x-auto [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-[#f1f1f1] [&::-webkit-scrollbar-track]:rounded-[8px] [&::-webkit-scrollbar-thumb]:bg-[#d1d5db] [&::-webkit-scrollbar-thumb]:rounded-[8px] [&::-webkit-scrollbar-thumb:hover]:bg-[#9ca3af]">
                    <button
                            class="shrink-0 rounded-[12px] bg-gray-900 px-6 py-2.5 text-[15px] font-semibold text-white shadow-sm transition hover:bg-black">
                        Tất cả
                    </button>
                    <button
                            class="shrink-0 rounded-[12px] border border-transparent px-6 py-2.5 text-[15px] font-medium text-gray-500 hover:border-gray-900 hover:text-gray-900 transition">
                        Đang giao
                    </button>
                    <button
                            class="shrink-0 rounded-[12px] border border-transparent px-6 py-2.5 text-[15px] font-medium text-gray-500 hover:border-gray-900 hover:text-gray-900 transition">
                        Hoàn thành
                    </button>
                    <button
                            class="shrink-0 rounded-[12px] border border-transparent px-6 py-2.5 text-[15px] font-medium text-gray-500 hover:border-gray-900 hover:text-gray-900 transition">
                        Đã hủy
                    </button>
                </div>

                <!-- ORDER LIST (Scrollable) -->
                <div
                        class="flex flex-1 flex-col gap-4 overflow-y-auto pr-2 [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-[#f1f1f1] [&::-webkit-scrollbar-track]:rounded-[8px] [&::-webkit-scrollbar-thumb]:bg-[#d1d5db] [&::-webkit-scrollbar-thumb]:rounded-[8px] [&::-webkit-scrollbar-thumb:hover]:bg-[#9ca3af] bg-gray-50/50 rounded-2xl p-6 border border-gray-100">
                    <!-- Empty State -->
                    <div class="flex flex-1 flex-col items-center justify-center gap-3 text-gray-500 min-h-[200px]">
                        <div class="h-20 w-20 rounded-full bg-white flex items-center justify-center shadow-sm">
                            <i class="fa fa-box-open text-3xl text-gray-400"></i>
                        </div>
                        <span class="font-medium text-gray-600">Chưa có đơn hàng nào</span>
                    </div>
                </div>
            </section>

        </div>
    <!-- ADDRESS MODAL -->
    <div id="addressModal" th:classappend="${showAddressModal == true} ? '' : 'hidden'" class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4 backdrop-blur-sm transition-opacity">
        <div class="w-full max-w-md rounded-[24px] bg-white p-6 md:p-8 shadow-2xl transform transition-transform">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-900">Thêm địa chỉ mới</h3>
                <button onclick="document.getElementById('addressModal').classList.add('hidden')" class="text-gray-400 hover:text-gray-600 transition p-2"><i class="fa fa-xmark text-xl"></i></button>
            </div>
            
            <form method="post" th:action="@{/profile/addresses}" th:object="${addressRequest}" class="flex flex-col gap-4">
                <div th:if="${addressError}" class="rounded-xl bg-red-50 p-3 border border-red-100 flex items-start gap-2 text-sm text-red-600 mb-2">
                    <i class="fa fa-circle-exclamation mt-0.5"></i>
                    <span th:text="${addressError}"></span>
                </div>
            
                <div>
                    <label class="mb-1.5 block text-sm font-semibold text-gray-700">Tỉnh/Thành phố *</label>
                    <input type="text" th:field="*{city}" required maxlength="32" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-[15px] focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition" placeholder="VD: TP. Hồ Chí Minh">
                    <p th:if="${#fields.hasErrors('city')}" th:errors="*{city}" class="mt-1.5 text-xs font-medium text-red-500"></p>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-semibold text-gray-700">Quận/Huyện</label>
                    <input type="text" th:field="*{district}" maxlength="32" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-[15px] focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition" placeholder="VD: Quận 1">
                    <p th:if="${#fields.hasErrors('district')}" th:errors="*{district}" class="mt-1.5 text-xs font-medium text-red-500"></p>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-semibold text-gray-700">Phường/Xã *</label>
                    <input type="text" th:field="*{ward}" required maxlength="32" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-[15px] focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition" placeholder="VD: Phường Bến Nghé">
                    <p th:if="${#fields.hasErrors('ward')}" th:errors="*{ward}" class="mt-1.5 text-xs font-medium text-red-500"></p>
                </div>
                <div>
                    <label class="mb-1.5 block text-sm font-semibold text-gray-700">Địa chỉ chi tiết (Số nhà, đường) *</label>
                    <input type="text" th:field="*{address}" required maxlength="64" class="w-full rounded-xl border border-gray-300 px-4 py-3 text-[15px] focus:border-red-500 focus:outline-none focus:ring-2 focus:ring-red-500/20 transition" placeholder="VD: Số 1 Lê Duẩn">
                    <p th:if="${#fields.hasErrors('address')}" th:errors="*{address}" class="mt-1.5 text-xs font-medium text-red-500"></p>
                </div>
                
                <div class="flex items-center gap-3 mt-3 bg-gray-50 p-3 rounded-xl border border-gray-100">
                    <input type="checkbox" th:field="*{isDefault}" id="isDefault" class="h-4.5 w-4.5 rounded border-gray-300 text-red-600 focus:ring-red-600">
                    <label for="isDefault" class="text-[15px] font-medium text-gray-700 cursor-pointer select-none">Đặt làm địa chỉ mặc định</label>
                </div>
                
                <div class="mt-6 flex justify-end gap-3 pt-4 border-t border-gray-100">
                    <button type="button" onclick="document.getElementById('addressModal').classList.add('hidden')" class="rounded-xl border border-gray-200 bg-white px-6 py-3 text-[15px] font-semibold text-gray-700 hover:bg-gray-50 transition">Hủy</button>
                    <button type="submit" class="rounded-xl bg-red-500 px-6 py-3 text-[15px] font-semibold text-white shadow-sm hover:bg-red-600 transition hover:shadow-md">Lưu địa chỉ</button>
                </div>
            </form>
        </div>
</main>



</body>

</html>
