<!DOCTYPE html>
<html lang="vi" th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Thông tin tài khoản | SLY</title>
</head>

<body>
<main class="min-h-screen bg-[#f7f7f7] px-4 py-12 md:px-10 lg:px-16">
    <div class="mx-auto max-w-7xl space-y-10">

        <!-- HEADER -->
        <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between mb-6">
            <div>
                <h1 class="mt-2 text-3xl font-bold text-gray-900">Thông tin tài khoản</h1>
            </div>
        </div>

        <!-- LAYOUT -->
        <div class="flex flex-col gap-8">

            <!-- ROW 1: INFO & ADDRESS -->
            <section class="flex flex-col gap-8 mb-10 lg:grid lg:grid-cols-[415px_minmax(0,1fr)] lg:items-stretch">

                <!-- CARD 1: SIDEBAR (INFO) -->
                <aside
                        class="rounded-[28px] border border-gray-200 bg-white px-8 py-10 shadow-sm flex flex-col h-full">
                    <div class="flex flex-col items-center text-center">
                        <!-- Avatar -->
                        <div class="flex h-24 w-24 items-center justify-center rounded-full shadow-md ring-4 ring-white"
                             style="background: linear-gradient(135deg, #c9d6e3 0%, #a0b0c4 100%);">
                            <i class="fa fa-user text-3xl" style="color: #4a5a6e;"></i>
                        </div>

                        <!-- Info -->
                        <h2 class="mt-5 text-xl font-bold text-gray-900" th:text="${user.name}">Tên người dùng</h2>
                        <div class="mt-4 text-left space-y-1">
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">Email:</span>
                                <span th:text="${user.email != null ? user.email : 'Chưa cập nhật'}"></span>
                            </p>
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">SĐT:</span>
                                <span th:text="${user.phone != null ? user.phone : 'Chưa cập nhật'}"></span>
                            </p>
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">Giới tính:</span>
                                <span th:text="${user.gender != null ? (user.gender.name() == 'MALE' ? 'Nam' : 'Nữ') : 'Chưa cập nhật'}"></span>
                            </p>
                            <p class="text-sm text-gray-500">
                                <span class="font-semibold">Ngày sinh:</span>
                                <span th:text="${user.birthDate != null ? #temporals.format(user.birthDate, 'dd-MM-yyyy') : 'Chưa cập nhật'}"></span>
                            </p>
                        </div>

                        <!-- Stats -->
                        <div class="mt-8 flex w-full justify-between rounded-2xl bg-gray-50 p-5">
                            <div class="flex flex-col items-center gap-1 flex-1">
                                <span class="text-lg font-bold text-gray-900">0</span>
                                <span class="text-xs text-gray-500 font-medium text-center">Đơn hàng</span>
                            </div>
                            <div class="w-px bg-gray-200"></div>
                            <div class="flex flex-col items-center gap-1 flex-1">
                                <span class="text-lg font-bold text-gray-900">0</span>
                                <span class="text-xs text-gray-500 font-medium text-center">Địa chỉ</span>
                            </div>
                        </div>

                        <!-- Member since -->
                        <p class="mt-3 text-xs text-gray-400 text-center">
                            Là thành viên từ ngày
                            <span class="font-semibold text-gray-600"
                                  th:text="${#temporals.format(user.createdAt, 'dd-MM-yyyy')}">--/--/----</span>
                        </p>
                    </div>

                    <!-- ACTION -->
                    <div class="mt-auto pt-6 flex flex-col items-center gap-3">
                        <div style="width: 220px;">
                            <a class="block w-full rounded-xl border border-red-500 bg-white px-4 py-2.5 text-center text-sm font-semibold text-red-500 transition hover:bg-red-50"
                               th:href="@{/profile/update}">
                                Cập nhật thông tin
                            </a>
                        </div>
                        <div style="width: 220px;">
                            <form method="post" th:action="@{/auth/logout}">
                                <button class="my-btn-primary w-full" type="submit">Đăng xuất</button>
                            </form>
                        </div>
                    </div>
                </aside>

                <!-- CARD 2: ĐỊA CHỈ -->
                <section
                        class="rounded-[28px] border border-gray-200 bg-white px-8 py-10 shadow-sm flex flex-col h-full">
                    <!-- Address Card Header -->
                    <div class="mb-6 flex items-center justify-between border-b border-gray-100 pb-4 shrink-0"
                         style="margin-left: 1cm; margin-right: 1cm;">
                        <div class="flex items-center gap-2">
                            <i class="fa fa-location-dot text-gray-500 text-xl"></i>
                            <h3 class="text-xl font-bold text-gray-900">Địa chỉ</h3>
                        </div>
                        <button class="rounded-xl border border-gray-200 px-4 py-2 text-sm font-semibold hover:bg-gray-50 transition"
                                type="button">
                            + Thêm mới
                        </button>
                    </div>

                    <!-- ADDRESS LIST (Scrollable) -->
                    <div class="flex flex-1 flex-col gap-4 overflow-y-auto pr-2 [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-[#f1f1f1] [&::-webkit-scrollbar-track]:rounded-[8px] [&::-webkit-scrollbar-thumb]:bg-[#d1d5db] [&::-webkit-scrollbar-thumb]:rounded-[8px] [&::-webkit-scrollbar-thumb:hover]:bg-[#9ca3af]">
                        <!-- Empty State -->
                        <div
                                class="flex flex-1 flex-col items-center justify-center gap-2 text-gray-500 min-h-[150px]">
                            <i class="fa fa-map-location-dot text-3xl mb-1"></i>
                            <span class="text-center">Bạn chưa có địa chỉ nào</span>
                        </div>
                    </div>
                </section>

            </section>

            <!-- ROW 2: ĐƠN HÀNG -->
            <section
                    class="mt-0 rounded-[28px] border border-gray-200 bg-white p-6 md:p-8 shadow-sm flex flex-col min-h-[500px]">
                <!-- Header -->
                <div class="mb-6 flex items-center justify-between">
                    <div class="flex items-center gap-2">
                        <i class="fa fa-bag-shopping text-gray-500 text-xl"></i>
                        <h3 class="text-xl font-bold text-gray-900">Đơn hàng của tôi</h3>
                    </div>
                    <a class="text-red-500 hover:text-red-600 font-semibold text-sm flex items-center gap-1"
                       th:href="@{/products}">
                        Mua sắm tiếp <i class="fa fa-arrow-right"></i>
                    </a>
                </div>

                <!-- Order Status Tabs -->
                <div
                        class="flex items-center gap-2 mb-6 border-b border-gray-100 pb-4 overflow-x-auto [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-[#f1f1f1] [&::-webkit-scrollbar-track]:rounded-[8px] [&::-webkit-scrollbar-thumb]:bg-[#d1d5db] [&::-webkit-scrollbar-thumb]:rounded-[8px] [&::-webkit-scrollbar-thumb:hover]:bg-[#9ca3af]">
                    <button
                            class="shrink-0 rounded-[12px] bg-gray-900 px-6 py-2.5 text-[15px] font-semibold text-white shadow-sm transition hover:bg-black">
                        Tất cả
                    </button>
                    <button
                            class="shrink-0 rounded-[12px] border border-transparent px-6 py-2.5 text-[15px] font-medium text-gray-500 hover:border-gray-900 hover:text-gray-900 transition">
                        Đang giao
                    </button>
                    <button
                            class="shrink-0 rounded-[12px] border border-transparent px-6 py-2.5 text-[15px] font-medium text-gray-500 hover:border-gray-900 hover:text-gray-900 transition">
                        Hoàn thành
                    </button>
                    <button
                            class="shrink-0 rounded-[12px] border border-transparent px-6 py-2.5 text-[15px] font-medium text-gray-500 hover:border-gray-900 hover:text-gray-900 transition">
                        Đã hủy
                    </button>
                </div>

                <!-- ORDER LIST (Scrollable) -->
                <div
                        class="flex flex-1 flex-col gap-4 overflow-y-auto pr-2 [&::-webkit-scrollbar]:w-[6px] [&::-webkit-scrollbar-track]:bg-[#f1f1f1] [&::-webkit-scrollbar-track]:rounded-[8px] [&::-webkit-scrollbar-thumb]:bg-[#d1d5db] [&::-webkit-scrollbar-thumb]:rounded-[8px] [&::-webkit-scrollbar-thumb:hover]:bg-[#9ca3af] bg-gray-50/50 rounded-2xl p-6 border border-gray-100">
                    <!-- Empty State -->
                    <div class="flex flex-1 flex-col items-center justify-center gap-3 text-gray-500 min-h-[200px]">
                        <div class="h-20 w-20 rounded-full bg-white flex items-center justify-center shadow-sm">
                            <i class="fa fa-box-open text-3xl text-gray-400"></i>
                        </div>
                        <span class="font-medium text-gray-600">Chưa có đơn hàng nào</span>
                    </div>
                </div>
            </section>

        </div>
    </div>
</main>

</body>

</html>
