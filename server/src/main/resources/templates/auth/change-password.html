<!DOCTYPE html>
<html lang="vi" th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Đổi mật khẩu | SLY</title>
</head>
<body>
<main class="flex flex-col items-center justify-center">
    <form class="mt-4 flex w-10/12 flex-col gap-4 rounded-md border border-gray-300 p-4 md:w-5/12 lg:w-3/12"
          action="/auth/change-password" method="post"
          th:object="${changePasswordRequest}">
        <h1 class="text-center text-2xl font-semibold">ĐỔI MẬT KHẨU</h1>

        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="flex flex-col gap-2">
            <label class="font-semibold" for="phone">Số điện thoại đã đăng ký</label>
            <input class="peer my-input"
                   type="tel"
                   id="phone"
                   th:field="*{phone}"
                   th:readonly="${changePasswordRequest.phone != null}"
                   pattern="^0[2-9]\d{8}$"
                   required
                   autocomplete="tel"
                   autofocus/>
            <span class="hidden text-red-500 peer-invalid:block">Số điện thoại không hợp lệ</span>
            <span th:errorclass="text-red-500" th:errors="*{phone}"></span>
        </div>

        <div class="flex flex-col gap-2 grow">
            <label class="font-semibold" for="otp">Mã OTP</label>
            <div class="flex gap-2 flex-wrap">
                <input class="peer my-input w-full md:w-auto md:grow"
                       type="text"
                       id="otp"
                       th:field="*{otp}"
                       autofocus
                       autocomplete="one-time-code"
                       required/>
                <button class="my-btn-tertiary  w-full md:w-auto"
                        type="button"
                        id="btnResend"
                        onclick="resend()"
                        disabled>
                    Gửi mã
                </button>
            </div>
            <span th:errorclass="text-red-500" th:errors="*{otp}"></span>
        </div>

        <div class="flex flex-col gap-2">
            <label class="font-semibold" for="password">Mật khẩu mới</label>
            <input class="peer my-input"
                   type="password"
                   id="password"
                   autocomplete="new-password"
                   pattern="^(?=.*[A-Z])(?=.*[a-z])(?=.*\d)(?=.*[@$!%*?&_]).{8,}$"
                   required
                   th:field="*{password}"/>
            <span class="hidden text-red-500 peer-invalid:block">
                Mật khẩu phải có ít nhất 8 ký tự và chứa ít nhất một chữ cái, một số và một ký tự đặc biệt.
            </span>
            <span th:errorclass="text-red-500" th:errors="*{password}"></span>
        </div>

        <div class="flex flex-col gap-2">
            <label class="font-semibold" for="password-retype">Nhập lại mật khẩu mới</label>
            <input class="peer my-input"
                   type="password"
                   id="password-retype"
                   required/>
            <span class="hidden text-red-500 peer-invalid:block">Mật khẩu không khớp nhau.</span>
        </div>

        <button class="my-btn-primary">Xác nhận Đổi mật khẩu</button>

        <div class="flex flex-wrap justify-between">
            <a class="hover:text-red-500" href="/auth/login">Đăng nhập</a>
            <a class="hover:text-red-500" href="/auth/register">Đăng ký tài khoản</a>
        </div>
    </form>

    <script th:inline="javascript">
        let remainingTime = /*[[${remainingTime}]]*/ 0;
        const phone = document.getElementById("phone");
        const btnResend = document.getElementById("btnResend");

        function resend() {
            if (phone instanceof HTMLInputElement && phone.reportValidity()) {
                location.replace("/auth/change-password?phone=" + phone.value.trim());
            }
        }

        const interval = setInterval(updateCooldown, 1000);

        function updateCooldown() {
            if (btnResend instanceof HTMLButtonElement && phone instanceof HTMLInputElement && phone.reportValidity()) {
                btnResend.disabled = remainingTime > 0;
                btnResend.innerText = `Gửi mã (${remainingTime})`;

                if (remainingTime <= 0) {
                    clearInterval(interval);
                    btnResend.innerText = `Gửi mã`;
                }

                remainingTime--;
            }
        }
    </script>

    <script>
        const password = document.getElementById('password');
        const passwordReType = document.getElementById('password-retype');

        if (password instanceof HTMLInputElement) {
            password.addEventListener('input', () => (passwordReType.pattern = password.value));
        }
    </script>
</main>
</body>
</html>
