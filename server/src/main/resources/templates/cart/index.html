<!DOCTYPE html>
<html lang="vi"
      th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Giỏ hàng | SLY</title>
</head>
<body>
<main class="container mx-auto px-3 pt-5 pb-8">
    <h1 class="mb-4 text-2xl font-bold">Giỏ hàng</h1>

    <div class="rounded border border-gray-200 bg-white p-4" th:if="${product != null}">
        <p class="text-sm text-gray-500">Sản phẩm đã chọn</p>
        <div class="mt-3 flex flex-col gap-4 md:flex-row md:items-center">
            <img class="h-28 w-28 rounded border border-gray-200 object-contain"
                 th:if="${!#lists.isEmpty(product.productImages())}"
                 th:src="@{${imageContainerUrl} + ${product.productImages().get(0).file()}}"
                 th:alt="${product.name()}"/>
            <div>
                <h2 class="text-xl font-semibold" th:text="${product.name()}">Tên sản phẩm</h2>
                <p class="mt-1 text-gray-700">Size: <span th:text="${selectedSize ?: 'Chưa chọn'}">M</span></p>
                <p class="text-gray-700">Số lượng: <span th:text="${quantity}">1</span></p>
            </div>
        </div>
    </div>

    <div class="rounded border border-dashed border-gray-300 bg-gray-50 p-6 text-gray-600" th:unless="${product != null}">
        Chưa có sản phẩm nào trong giỏ hàng. Hãy chọn sản phẩm và bấm <strong>Thêm giỏ hàng</strong>.
    </div>

    <div class="mt-6">
        <a class="rounded bg-red-500 px-4 py-2 font-semibold text-white hover:bg-red-400" href="/danh-sach-san-pham">
            Tiếp tục mua sắm
        </a>
    </div>
</main>
</body>
</html>
