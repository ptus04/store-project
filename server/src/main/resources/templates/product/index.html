<!DOCTYPE html>
<html lang="vi"
      th:replace="~{layout/main :: mainLayout(~{::title}, ~{::main})}"
      xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách sản phẩm | SLY</title>
    <style>
        details .search-panel {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 220ms ease, opacity 220ms ease;
        }

        details[open] .search-panel {
            max-height: 640px;
            opacity: 1;
        }

        details summary::-webkit-details-marker {
            display: none;
        }
    </style>
</head>
<body>
<main class="container mx-auto px-3 pt-5">
    <div class="flex gap-6">
        <aside class="hidden w-64 shrink-0 md:block">
            <div class="rounded border border-gray-200 bg-white p-4">
                <details class="group"
                         th:open="${(query != null and !#strings.isEmpty(query)) or (minPrice != null and !#strings.isEmpty(minPrice)) or (maxPrice != null and !#strings.isEmpty(maxPrice))}">
                    <summary
                            class="flex cursor-pointer select-none items-center justify-between font-bold hover:text-red-500">
                        <span>Tìm kiếm</span>
                        <i class="fa fa-chevron-down text-sm transition-transform duration-200 group-open:rotate-180"></i>
                    </summary>
                    <div class="search-panel">
                        <form action="/products" class="mt-3" method="get">
                            <div class="flex flex-col gap-2">
                                <label class="flex flex-col gap-1">
                                    <span class="text-sm font-semibold">Từ khóa</span>
                                    <input class="border border-gray-300 rounded px-3 py-2"
                                           name="query"
                                           placeholder="Nhập tên sản phẩm"
                                           th:value="${query}"
                                           type="search"/>
                                </label>
                                <label class="flex flex-col gap-1">
                                    <span class="text-sm font-semibold">Giá từ</span>
                                    <input class="border border-gray-300 rounded px-3 py-2"
                                           min="0"
                                           name="minPrice"
                                           placeholder="0"
                                           th:value="${minPrice}"
                                           type="number"/>
                                </label>
                                <label class="flex flex-col gap-1">
                                    <span class="text-sm font-semibold">Giá đến</span>
                                    <input class="border border-gray-300 rounded px-3 py-2"
                                           min="0"
                                           name="maxPrice"
                                           placeholder="0"
                                           th:value="${maxPrice}"
                                           type="number"/>
                                </label>
                                <input name="page" type="hidden" value="0"/>
                                <input name="sortBy" th:value="${sortBy}" type="hidden"/>
                                <input name="category" th:value="${activeCategory}" type="hidden"/>
                                <button class="rounded bg-black px-4 py-2 text-white cursor-pointer hover:bg-red-500"
                                        type="submit">Tìm kiếm
                                </button>
                            </div>
                        </form>
                    </div>
                </details>
            </div>

            <div class="mt-4 rounded border border-gray-200 bg-white p-4">
                <h3 class="font-bold mb-2">Danh mục</h3>
                <ul class="flex flex-col gap-1">
                    <li>
                        <a th:classappend="${activeCategory == null or activeCategory == ''} ? ' font-bold text-red-500' : ''"
                           class="hover:text-red-500"
                           th:href="@{/products(sortBy=${sortBy}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}">Tất
                            cả</a>
                    </li>
                    <li th:each="category : ${categories}">
                        <a th:classappend="${activeCategory != null and activeCategory.equals(category.name.toLowerCase())} ? ' font-bold text-red-500' : ''"
                           class="hover:text-red-500"
                           th:href="@{/products(category=${category.name.toLowerCase()}, sortBy=${sortBy}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
                           th:text="${category.name}">
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <div class="flex-1">
            <div class="flex justify-between items-center mb-4">
                <h1 class="text-2xl">Danh sách sản phẩm</h1>

                <!-- Sorting dropdown -->
                <form class="flex items-center gap-2" method="get">
                    <label class="font-semibold" for="sortBy">Sắp xếp theo:</label>
                    <select class="border border-gray-300 rounded px-3 py-2" id="sortBy" name="sortBy"
                            onchange="this.form.submit()">
                        <option th:selected="${sortBy == 'newest'}" value="newest">Mới nhất</option>
                        <option th:selected="${sortBy == 'price_asc'}" value="price_asc">Giá: Tăng dần</option>
                        <option th:selected="${sortBy == 'price_desc'}" value="price_desc">Giá: Giảm dần</option>
                        <option th:selected="${sortBy == 'discount_asc'}" value="discount_asc">Giảm giá: Tăng dần
                        </option>
                        <option th:selected="${sortBy == 'discount_desc'}" value="discount_desc">Giảm giá: Giảm dần
                        </option>
                    </select>
                    <input name="page" type="hidden" value="0">
                    <input name="category" th:value="${activeCategory}" type="hidden"/>
                    <input name="query" th:value="${query}" type="hidden"/>
                    <input name="minPrice" th:value="${minPrice}" type="hidden"/>
                    <input name="maxPrice" th:value="${maxPrice}" type="hidden"/>
                </form>
            </div>

            <div class="flex flex-wrap">
                <div class="w-full p-2 text-center md:w-1/4 lg:w-1/5 flex flex-col justify-between"
                     th:each="product:${products}">
                    <a class="relative flex flex-col justify-between h-full"
                       th:href="@{/products/{id}(id=${product.id()})}">
                        <div class="relative flex flex-1">
                            <p class="absolute top-1/10 left-1/10 rounded-full bg-red-500 px-3 py-1 text-white"
                               th:if="${product.discount() != 0}"
                               th:text="${#numbers.formatDecimal(product.discount() * 100, 0, 0)} + '%'">
                            </p>
                            <img class="w-full object-contain"
                                 loading="lazy"
                                 th:alt="${product.name()}"
                                 th:src="@{${imageContainerUrl} + ${product.productImages().get(0).file()}}"/>
                            <p class="absolute top-1/2 w-full bg-white/75 px-6 py-2 text-2xl font-bold text-red-600"
                               th:if="${product.inStock() == 0}">
                                HẾT HÀNG
                            </p>
                        </div>
                        <p class="overflow-hidden text-nowrap text-ellipsis whitespace-nowrap"
                           th:text="${product.name()}">
                        </p>
                    </a>

                    <div th:unless="${product.discount() == 0}">
                        <p class="m-0 text-sm text-gray-500 line-through"
                           th:text="${#numbers.formatDecimal(product.price(), 0, 'POINT', 0, 'COMMA') + ' ₫'}">
                        </p>
                        <p class="m-0 font-bold text-red-600"
                           th:text="${#numbers.formatDecimal(product.price() * (1 - (product.discount())), 0, 'POINT', 0, 'COMMA') + ' ₫'}">
                        </p>
                    </div>
                    <p class="m-0 font-bold mt-5"
                       th:if="${product.discount() == 0}"
                       th:text="${#numbers.formatDecimal(product.price(), 0, 'POINT', 0, 'COMMA') + ' ₫'}">
                    </p>
                </div>
            </div>

        </div>
    </div>

    <div class="mt-6 font-bold flex items-center justify-center gap-2" th:if="${totalPages > 1}">
        <th:block th:with="paginationClass='px-3 py-2 rounded hover:bg-gray-300 transition'">
            <a th:class="${paginationClass} + ' text-xl'"
               th:href="@{/products(page=0, sortBy=${sortBy}, category=${activeCategory}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               th:if="${currentPage > 0}"
               title="Về đầu">
                &laquo;
            </a>

            <a th:class="${paginationClass} + ' text-xl'"
               th:href="@{/products(page=${currentPage - 1}, sortBy=${sortBy}, category=${activeCategory}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               th:if="${currentPage > 0}"
               title="Trang trước">
                &lsaquo;
            </a>

            <a th:class="${paginationClass}"
               th:classappend="${i == currentPage} ? ' bg-red-500 text-white' : ''"
               th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
               th:href="@{/products(page=${i}, sortBy=${sortBy}, category=${activeCategory}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               th:text="${i + 1}">
            </a>

            <a th:class="${paginationClass} + ' text-xl'"
               th:href="@{/products(page=${currentPage + 1}, sortBy=${sortBy}, category=${activeCategory}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               th:if="${currentPage < totalPages - 1}"
               title="Trang sau">
                &rsaquo;
            </a>

            <a th:class="${paginationClass} + ' text-xl'"
               th:href="@{/products(page=${totalPages - 1}, sortBy=${sortBy}, category=${activeCategory}, query=${query}, minPrice=${minPrice}, maxPrice=${maxPrice})}"
               th:if="${currentPage < totalPages - 1}"
               title="Đến cuối">
                &raquo;
            </a>
        </th:block>
    </div>
</main>
</body>
</html>
