spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: store-server
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: true
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-exception: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  http2:
    enabled: true
management:
  endpoint:
    health:
      roles: ADMIN
      show-components: when_authorized
      show-details: when_authorized
custom:
  security:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS}
      allowed-methods: ${ALLOWED_METHODS}
      allowed-headers: ${ALLOWED_HEADERS}
      allow-credentials: ${ALLOW_CREDENTIALS}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

gemini:
  api-key: ${GEMINI_API_KEY}