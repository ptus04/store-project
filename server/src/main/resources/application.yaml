spring:
  application:
    name: store-server
  data:
    redis:
      repositories:
        enabled: false
  jpa:
    open-in-view: true
  threads:
    virtual:
      enabled: true
  web:
    error:
      include-exception: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  http2:
    enabled: true
management:
  endpoint:
    health:
      roles: ADMIN
      show-components: when_authorized
      show-details: when_authorized

custom:
  security:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS}
      allowed-methods: ${ALLOWED_METHODS}
      allowed-headers: ${ALLOWED_HEADERS}
      allow-credentials: ${ALLOW_CREDENTIALS}
  sepay:
    account-name: ${SEPAY_ACCOUNT_NAME}
    account-number: ${SEPAY_ACCOUNT_NUMBER}
    bank: ${SEPAY_BANK}
    username: ${SEPAY_USERNAME}
    password: ${SEPAY_PASSWORD}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}