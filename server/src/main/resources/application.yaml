spring:
  application:
    name: store-server
  data:
    redis:
      repositories:
        enabled: false
  threads:
    virtual:
      enabled: true
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  rabbitmq:
    listener:
      simple:
        retry:
          enabled: true
          multiplier: 2.0
      direct:
        acknowledge-mode: manual

custom:
  security:
    cors:
      allowed-origins: ${ALLOWED_ORIGINS}
      allowed-methods: ${ALLOWED_METHODS}
      allowed-headers: ${ALLOWED_HEADERS}
      allow-credentials: ${ALLOW_CREDENTIALS}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    verify:
      service-sid: ${TWILIO_VERIFY_SERVICE_SID}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:120}
    window: ${RATE_LIMIT_WINDOW:1m}
    policies:
      - path-prefix: /api/auth/login
        capacity: ${RATE_LIMIT_AUTH_CAPACITY:10}
        window: ${RATE_LIMIT_AUTH_WINDOW:1m}
      - path-prefix: /api/chat
        capacity: ${RATE_LIMIT_CHAT_CAPACITY:20}
        window: ${RATE_LIMIT_CHAT_WINDOW:1m}
      - path-prefix: /api/support
        capacity: ${RATE_LIMIT_SUPPORT_CAPACITY:60}
        window: ${RATE_LIMIT_SUPPORT_WINDOW:1m}

jwt:
  secret: ${JWT_SECRET}
  expiration-ms: ${JWT_EXPIRATION_MS}

sepay:
  qr:
    bank: ${SEPAY_BANK}
    account-name: ${SEPAY_ACCOUNT_NAME}
    account-number: ${SEPAY_ACCOUNT_NUMBER}
  invoice:
    username: ${SEPAY_USERNAME}
    password: ${SEPAY_PASSWORD}
    auth-url: ${SEPAY_INVOICE_AUTH_URL}
    create-url: ${SEPAY_INVOICE_CREATE_URL}
    check-url: ${SEPAY_INVOICE_CHECK_URL}
